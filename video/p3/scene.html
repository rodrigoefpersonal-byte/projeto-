    else if (t < E.pump - 0.3) camPath(t, E.molinho - 0.6, E.pump - 0.3, W3(-9.3, 1.6, 7.0), W3(-8.4, 1.5, 6.0), W3(-5.6, 0.5, 3.9), W3(-5.6, 0.5, 3.9), 44, 40);
    else camPath(t, E.pump - 0.3, T.S4, W3(-9.2, 2.6, 5.4), W3(-8.6, 2.4, 4.6), W3(-4.4, 1.4, 0.2), W3(-4.4, 1.5, 0.2), 50, 46);
    tagAt(W3(-3.0, 6.6, 0.1), '+ ÁGUA', '#3fa7ff', t, E.water, E.molinho);
    tagAt(W3(-5.6, 2.2, 3.9), 'MOLINHO', '#ff8a1f', t, E.molinho + 0.4, E.pump);
    tagAt(W3(-4.4, 2.4, -0.6), 'A BOMBA ANDOU', '#3ddc84', t, E.pump);
  }
  // ---------- S4: inside the concrete ----------
  if (S === 'S4') {
    showMode('ins'); tagMinY = 560; sun.position.set(10, 40, -2000 + 30); sun.target.position.set(0, 0, -2000);
    const ex = (t - E.extra); waters.forEach((w, i) => { const first = i < 14; const appear = first ? 1 : easeOut(clamp((ex - (i - 14) * 0.02) / 0.5)); const vanish = ease(clamp((t - E.holes - (i % 10) * 0.05) / 0.9));
      w.visible = t < E.holes + 1.6; w.scale.setScalar(Math.max(0.0001, appear * (1 - vanish))); holes[i].scale.setScalar(Math.max(0.0001, vanish * (first ? 0.7 : 1))); });
    const ang = lerp(0.2, 1.3, seg(t, T.S4, T.S5)); const c = v3(0, 2.2, -2000);
    cam(v3(Math.sin(ang) * 10.5, 5.6, -2000 + Math.cos(ang) * 10.5), c, 44);
    tagAt(v3(0, 5.0, -2000), 'DENTRO DO CONCRETO', '#9aa4b2', t, T.S4 + 0.1, E.extra);
    tagAt(v3(2.6, 4.6, -2000), 'ÁGUA DE MAIS', '#3fa7ff', t, E.extra + 0.2, E.holes);
    tagAt(v3(-2.6, 4.6, -2000), 'BURAQUINHOS (POROS)', '#ff8a1f', t, E.holes + 0.3);
    hud.push({ kind: 'meter', water: t < E.extra ? 0.3 : lerp(0.3, 0.92, easeOut(seg(t, E.extra, E.extra + 0.7))), str: t < E.fraco ? 0.9 : lerp(0.9, 0.3, ease(seg(t, E.fraco, E.fraco + 1.3))), age: t - T.S4 });
  }
  // ---------- S5: the talk ----------
  if (S === 'S5') {
    teo.visible = true; jorgeC.visible = true; teo.position.set(-22.9, 0.2, 11.6); teo.rotation.y = Math.PI / 2 - 0.15; jorgeC.position.set(-20.7, 0.2, 11.6); jorgeC.rotation.y = -Math.PI / 2 + 0.15;
    pose(teo, { look: 0.05 }); pose(jorgeC, { look: 0.5 + 0.05 * Math.sin(t * 3), shock: 0 });
    camPath(t, T.S5, T.S6, v3(-22.6, 2.6, 24.0), v3(-21.9, 2.4, 21.2), v3(-21.8, 2.0, 11.6), v3(-21.8, 2.1, 11.6), 40, 37);
    tagAt(v3(-20.7, 3.9, 11.6), 'SEU JORGE', '#ff8a1f', t, T.S5 + 0.2, E.quote);
    if (t >= E.quote) bubble = { age: t - E.quote, text: '"Achei que um pouquinho não ia fazer diferença."' };
  }
  // ---------- S6: the proof ----------
  if (S === 'S6') {
    floorLight(); crackG.visible = true; setSeal(true); teo.visible = marta.visible = true; drill.visible = true;
    teo.position.set(SX + 3.5, LY, SZ - 1.9); teo.rotation.y = -0.6; pose(teo, { look: 0.15 });
    const kn = ease(seg(t, T.S6 + 0.4, T.S6 + 1.6)); marta.position.set(SX - 0.15, LY, SZ + 1.0); marta.rotation.y = Math.PI; pose(marta, { kneel: t > E.hammer - 1.4 ? ease(seg(t, E.hammer - 1.4, E.hammer - 0.4)) : 0, look: 0.1 });
    // drill descends / core rises
    const dd = ease(seg(t, E.core, E.core + 1.6)), up = ease(seg(t, E.core + 2.0, E.core + 2.8));
    motor.position.set(0, lerp(2.1, 1.0, dd) + up * 0.7 * 0, -0.0); motor.position.y = lerp(2.2, 1.15, dd) * (1 - up) + up * 2.2;
    bit.position.y = -0.7 - dd * 0.0; bit.visible = true;
    core.visible = t > E.core + 2.0; core.position.set(SX + 2.0, LY - 0.4 + up * 1.4 - (t > E.core + 3.2 ? ease(seg(t, E.core + 3.2, E.core + 3.8)) * 1.35 : 0) + 0.45, SZ + 0.3 + (t > E.core + 3.2 ? ease(seg(t, E.core + 3.2, E.core + 3.8)) * 0.9 : 0)); core.rotation.z = t > E.core + 3.8 ? Math.PI / 2 : 0; if (t > E.core + 3.8) core.position.y = LY + 0.22;
    hammer.visible = t > E.hammer - 0.9; const tapT = (t - E.hammer); const tap = tapT > 0 ? Math.max(0, Math.sin(tapT * 9)) * (tapT < 1.6 ? 1 : 0) : 0;
    hammer.position.set(SX - 0.5, LY + 0.02 + (1 - tap) * 0.18, SZ + 0.55); hammer.rotation.set(0, 0, 0);
    if (t < E.core - 0.4) camPath(t, T.S6, E.core - 0.4, v3(SX + 5.2, LY + 3.0, SZ + 5.0), v3(SX + 4.3, LY + 2.5, SZ + 4.2), v3(SX + 0.8, LY + 0.5, SZ + 0.2), v3(SX + 0.8, LY + 0.5, SZ + 0.2), 50, 46);
    else if (t < E.hammer - 0.6) camPath(t, E.core - 0.4, E.hammer - 0.6, v3(SX + 6.6, LY + 2.6, SZ + 4.6), v3(SX + 5.8, LY + 2.2, SZ + 4.0), v3(SX + 1.8, LY + 1.0, SZ + 0.2), v3(SX + 1.8, LY + 1.1, SZ + 0.2), 46, 42);
    else camPath(t, E.hammer - 0.6, T.S7, v3(SX - 4.2, LY + 1.6, SZ + 2.0), v3(SX - 3.6, LY + 1.3, SZ + 1.5), v3(SX - 0.3, LY + 0.35, SZ + 0.7), v3(SX - 0.3, LY + 0.35, SZ + 0.7), 48, 42);
    tagAt(v3(SX + 2.0, LY + 2.6, SZ + 0.3), 'TESTEMUNHO (CILINDRO DA LAJE)', '#ffd23f', t, E.core + 0.4, E.hammer - 0.8);
    tagAt(v3(SX - 0.5, LY + 1.2, SZ + 0.55), 'ESCLERÔMETRO', '#9aa4b2', t, E.hammer, E.result);
    if (t >= E.result) { hud.push({ kind: 'verdict', age: t - E.result }); vignette = 0.35; }
  }
  // ---------- S7: reinforcement ----------
  if (S === 'S7') {
    floorLight(); crackG.visible = true; setSeal(true);
    jackets.forEach((j, i) => { const k = easeOut(clamp((t - E.jacket - i * 0.28) / 0.7)); j.visible = k > 0; j.position.y = LY + (1 - k) * 4.0; });
    strips.forEach((s, i) => { const k = ease(clamp((t - E.carbon - i * 0.18) / 0.9)); s.visible = k > 0; const len = s.userData.len * k; if (s.userData.horiz) { s.scale.x = Math.max(0.001, len / s.userData.len); s.position.x = -s.userData.len / 2 + len / 2 - 0.0 + 0; s.position.x = (-s.userData.len / 2) + len / 2; } else { s.scale.z = Math.max(0.001, len / s.userData.len); s.position.z = -4.3 - s.userData.len / 2 + len / 2 + 0; s.position.z = (-4.3 - s.userData.len / 2) + len / 2; } });
    if (t < E.carbon - 0.4) camPath(t, T.S7, E.carbon - 0.4, v3(-8.2, LY + 2.8, 5.2), v3(-6.8, LY + 2.4, 3.8), v3(0, LY + 0.8, -4.0), v3(0, LY + 0.8, -4.0), 56, 52);
    else camPath(t, E.carbon - 0.4, T.S8, v3(0.8, LY - 2.4, -0.2), v3(0.2, LY - 2.5, -1.0), v3(0, LY - 0.4, -4.2), v3(0, LY - 0.4, -4.4), 62, 58);
    tagAt(v3(2, LY + 2.2, -4), 'ENCAMISAMENTO DE AÇO', '#9aa4b2', t, E.jacket + 0.3, E.carbon - 0.4);
    tagAt(v3(0, LY - 0.9, -4.3), 'FIBRA DE CARBONO', '#1d1f24', t, E.carbon + 0.2);
  }
  // ---------- S8: load test ----------
  if (S === 'S8') {
    floorLight(); crackG.visible = true; teo.visible = marta.visible = true; teo.position.set(2.1, LY, -0.6); teo.rotation.y = Math.PI + 0.2; marta.position.set(-1.6, LY, -0.8); marta.rotation.y = Math.PI - 0.4; pose(teo, { look: 0.2 }); pose(marta, { look: 0.2 });
    bagPiles.forEach((p, i) => { const k = easeOut(clamp((t - E.bags - i * 0.25) / 0.5)); p.visible = k > 0; p.position.y = LY + (1 - k) * 4; });
    if (t < E.newSeal - 0.2) { setSeal(true); }
    else { setSeal(false); seal.position.y = (1 - easeOut(seg(t, E.newSeal, E.newSeal + 0.5))) * 0.6; }
    if (t < E.newSeal - 0.3) camPath(t, T.S8, E.newSeal - 0.3, v3(5.8, LY + 2.8, -0.2), v3(4.6, LY + 2.5, -1.0), v3(0, LY + 0.9, -5.0), v3(0, LY + 0.8, -5.0), 56, 52);
    else camPath(t, E.newSeal - 0.3, T.S9, v3(SX + 1.7, LY + 1.3, SZ - 0.7), v3(SX + 1.2, LY + 1.0, SZ - 0.5), v3(SX, LY, SZ), v3(SX, LY, SZ), 44, 38);
    tagAt(v3(0, LY + 3.0, -6), 'TESTE DE CARGA', '#ffd23f', t, E.bags + 0.4, E.newSeal - 0.3);
    if (t >= E.newSeal) tagAt(v3(SX, LY + 0.45, SZ), 'SELO NOVO', '#ffffff', t, E.newSeal + 0.5, E.inteiro);
    if (t >= E.bags + 1.0 && t < E.newSeal - 0.2) hud.push({ kind: 'load', age: t - (E.bags + 1.0) });
    if (t >= E.inteiro) stamp = { age: t - E.inteiro };
  }
  // ---------- S9 + S10: sunset finale ----------
  if (S === 'S9' || S === 'S10') {
    setSky(0.5); sun.position.set(70, 24, 72); sun.target.position.set(0, ROOFY, 0); sun.intensity = 2.2;
    glass.visible = true; roof.visible = true; stubs.visible = false; teo.visible = true; sticker.visible = true;
    const gk = easeOut(seg(t, T.S9 - 0.1, T.S9 + 2.2)) * NF; panes.forEach(m => { m.visible = m.userData.i < gk; });
    teo.position.set(2.2, ROOFY + 0.4, 2.6); teo.rotation.y = 0.7; pose(teo, { sip: t > 68.0 && t < 69.2 ? 1 : 0, look: -0.05 });
    if (S === 'S9') { camPath(t, T.S9, T.S10, v3(8.0, ROOFY + 2.0, 9.2), v3(10.6, ROOFY + 2.6, 12.4), v3(2.4, ROOFY + 1.6, 2.6), v3(2.0, ROOFY + 1.9, 2.4), 42, 50);
      if (t >= E.moral1) moral = { t, l1: 'Rachadura não é o problema.', l2: 'O problema é fingir que não viu.', k1: seg(t, E.moral1, E.moral1 + 0.35), k2: seg(t, E.moral2, E.moral2 + 0.35) }; }
    if (S === 'S10') { const x = seg(t, T.S10, T.END); const ang = lerp(0.65, 1.0, x); cam(v3(Math.sin(ang) * 66, 22, Math.cos(ang) * 66), v3(0, 22, 0), 50); darken = 0.5 * clamp((t - T.S10) / 0.5); endCard = { t }; }
  }
  if (shake > 0) { camera.position.x += Math.sin(t * 90) * 0.05 * shake; camera.position.y += Math.cos(t * 77) * 0.05 * shake; }
}

// ======================= OVERLAY =======================
let WORDS = [];
const RED = '#ff4b3e', YEL = '#ffd23f', GRN = '#3ddc84', BLU = '#7cc4ff', ORG = '#ff8a1f';
const HL = { jorge: YEL, balde: BLU, água: BLU, derrubou: RED, andar: YEL, concretagem: YEL, caminhões: YEL, relógio: YEL, cinco: YEL, duro: RED, bombear: YEL,
  acelerada: ORG, mangueira: BLU, molinho: ORG, feliz: GRN, buraquinhos: RED, fraco: RED, negou: YEL, diferença: RED, cilindro: YEL, martelinho: YEL, dureza: YEL,
  prova: GRN, verdade: GRN, demolir: RED, reforçar: GRN, aço: ORG, pilares: YEL, fibra: YEL, carbono: YEL, laje: YEL, sacos: YEL, areia: YEL, selo: YEL, inteiro: GRN,
  torre: YEL, moral: YEL, rachadura: RED, problema: RED, fingir: RED, viu: RED, segue: YEL, série: YEL, calma: YEL, derruba: RED, 'doze': YEL, 'téo': YEL, marta: YEL };

function drawVerdict(h) { const s = easeOut(clamp(h.age / 0.3)); ctx.save(); ctx.translate(W / 2, 690); ctx.scale(s, s); rr(-330, -120, 660, 240, 34); ctx.fillStyle = 'rgba(20,24,36,0.92)'; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = '#ff3b2f'; ctx.stroke();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = '800 32px Inter'; ctx.fillStyle = '#e9edf5'; ctx.fillText('RESISTÊNCIA DO CONCRETO', 0, -64);
  ctx.font = '80px Lilita'; ctx.fillStyle = '#ff3b2f'; ctx.fillText('ABAIXO DO', 0, -4); ctx.fillText('PROJETO', 0, 64); ctx.restore(); }
function drawMeter(h) { const s = easeOut(clamp(h.age / 0.3)); ctx.save(); ctx.translate(W / 2, 330); ctx.scale(s, s); rr(-360, -150, 720, 300, 34); ctx.fillStyle = 'rgba(20,24,36,0.9)'; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = '#ffd23f'; ctx.stroke();
  const bar = (y, label, v, col) => { ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.font = '800 32px Inter'; ctx.fillStyle = '#e9edf5'; ctx.fillText(label, -320, y - 38); rr(-320, y - 12, 640, 40, 20); ctx.fillStyle = '#2f3648'; ctx.fill(); rr(-320, y - 12, Math.max(40, 640 * v), 40, 20); ctx.fillStyle = col; ctx.fill(); };
  bar(-55, 'ÁGUA NA MISTURA', h.water, '#3fa7ff'); bar(70, 'RESISTÊNCIA', h.str, h.str > 0.6 ? '#3ddc84' : '#ff3b2f'); ctx.restore(); }
function drawLoad(h) { const s = easeOut(clamp(h.age / 0.3)); ctx.save(); ctx.translate(W / 2, 690); ctx.scale(s, s); rr(-300, -110, 600, 220, 34); ctx.fillStyle = 'rgba(20,24,36,0.9)'; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = '#3ddc84'; ctx.stroke();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = '800 30px Inter'; ctx.fillStyle = '#e9edf5'; ctx.fillText('MOVIMENTO DA LAJE', 0, -62); ctx.font = '96px Lilita'; ctx.fillStyle = '#3ddc84'; ctx.fillText('ESTÁVEL', 0, 20); ctx.restore(); }
function drawStamp(st) { const a = clamp(st.age / 0.15); const sc = lerp(2.0, 1, easeOut(a)); ctx.save(); ctx.translate(W / 2, 700); ctx.rotate(-0.12); ctx.scale(sc, sc); ctx.globalAlpha = a; ctx.font = '150px Lilita'; const tw = ctx.measureText('INTEIRO').width;
  rr(-tw / 2 - 40, -100, tw + 80, 200, 20); ctx.fillStyle = 'rgba(255,255,255,0.93)'; ctx.fill(); ctx.lineWidth = 14; ctx.strokeStyle = '#2fbf5a'; ctx.stroke(); ctx.fillStyle = '#2fbf5a'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('INTEIRO', 0, 8); ctx.restore(); }
function drawBubble(b) { const s = easeOut(clamp(b.age / 0.25)); ctx.save(); ctx.translate(W / 2, 560); ctx.scale(s, s); const w = 900, h = 230; ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 24; rr(-w / 2, -h / 2, w, h, 40); ctx.fillStyle = '#ffffff'; ctx.fill(); ctx.shadowColor = 'transparent';
  ctx.beginPath(); ctx.moveTo(150, h / 2 - 2); ctx.lineTo(210, h / 2 + 60); ctx.lineTo(240, h / 2 - 2); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#1b2030'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = '800 54px Inter'; ctx.fillText('"Achei que um pouquinho', 0, -36); ctx.fillText('não ia fazer diferença."', 0, 38); ctx.restore(); }
function drawOverlay(t) {
  ctx.clearRect(0, 0, W, H); ctx.drawImage(glCanvas, 0, 0, W, H);
  if (vignette > 0) { const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.25, W / 2, H / 2, H * 0.75); g.addColorStop(0, 'rgba(120,0,0,0)'); g.addColorStop(1, `rgba(120,0,0,${vignette})`); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
  if (darken > 0) { ctx.fillStyle = `rgba(8,10,20,${darken})`; ctx.fillRect(0, 0, W, H); }
  if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash})`; ctx.fillRect(0, 0, W, H); }
  for (const tg of tags) { const p = project(tg.world); if (p.behind) continue; pill(clamp(p.x, 330, W - 330), clamp(p.y, tagMinY, 1130), tg.text, tg.dot, tg.age); }
  for (const h of hud) { const s = easeOut(clamp(h.age / 0.25));
    if (h.kind === 'big') { ctx.save(); ctx.translate(W / 2, h.y); ctx.scale(s, s); outlined(h.top, 0, 0, 190, '#ffffff'); outlined(h.sub, 0, 118, 56, YEL, '#1b2030', 10); ctx.restore(); }
    if (h.kind === 'clock') { ctx.save(); ctx.translate(W / 2, h.y); ctx.scale(s, s); rr(-250, -95, 500, 190, 34); ctx.fillStyle = 'rgba(20,24,36,0.88)'; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = '#ff8a1f'; ctx.stroke(); ctx.font = '112px Lilita'; ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(h.text, 0, -16); ctx.font = '800 34px Inter'; ctx.fillStyle = '#ff8a1f'; ctx.fillText(h.sub, 0, 62); ctx.restore(); }
    if (h.kind === 'meter') drawMeter(h); if (h.kind === 'verdict') drawVerdict(h); if (h.kind === 'load') drawLoad(h); }
  if (bubble) drawBubble(bubble); if (stamp) drawStamp(stamp);
  if (moral) { ctx.save(); const k1 = easeOut(moral.k1), k2 = easeOut(moral.k2); rr(70, 330, W - 140, 590, 44); ctx.fillStyle = 'rgba(14,18,30,0.55)'; ctx.fill();
    ctx.globalAlpha = k1; ctx.translate(0, (1 - k1) * 30); outlined('Rachadura não é', W / 2, 450, 104, '#ffffff'); outlined('o problema.', W / 2, 565, 104, '#ffffff'); ctx.restore();
    ctx.save(); ctx.globalAlpha = k2; ctx.translate(0, (1 - k2) * 30); outlined('O problema é fingir', W / 2, 695, 92, '#ffd23f'); outlined('que não viu.', W / 2, 800, 92, '#ff4b3e'); ctx.restore(); }
  if (endCard) { const a = endCard.t; const k1 = easeOut(seg(a, 75.2, 75.5)), k2 = easeOut(seg(a, 76.2, 76.5)), k3 = seg(a, 77.4, 77.8);
    ctx.save(); ctx.translate(W / 2, 640); ctx.scale(k1, k1); outlined('FIM!', 0, 0, 230, '#ffffff'); ctx.restore();
    ctx.save(); ctx.globalAlpha = k2; outlined('A RACHADURA DO ANDAR 12', W / 2, 840, 78, '#ffd23f'); ctx.restore();
    ctx.save(); ctx.globalAlpha = k3; ctx.font = '800 44px Inter'; ctx.fillStyle = '#e9edf5'; ctx.textAlign = 'center'; ctx.fillText('SEGUE PRA VER O PRÓXIMO PRÉDIO', W / 2, 1010); ctx.restore(); }
  if (!endCard && !moral) {
    let cur = null; for (const w of WORDS) { if (t >= w.start - 0.03 && t < w.end + 0.45) cur = w; }
    if (cur) { const nx = WORDS[WORDS.indexOf(cur) + 1]; if (nx && t >= nx.start - 0.03) cur = nx;
      const txt = clean(cur.text).replace(/["“”]/g, ''); if (txt) { const key = txt.toLowerCase(); const disp = txt.charAt(0).toUpperCase() + txt.slice(1);
        const age = t - cur.start; const sc = age < 0.12 ? lerp(1.28, 1, easeOut(clamp(age / 0.12))) : 1;
        let size = 124; ctx.font = `${size}px Lilita`; while (ctx.measureText(disp).width > W - 220) { size -= 6; ctx.font = `${size}px Lilita`; }
        ctx.save(); ctx.translate(W / 2, 1290); ctx.scale(sc, sc); outlined(disp, 0, 0, size, HL[key] || '#ffffff'); ctx.restore(); } }
  }
  if (moral || endCard) { /* captions hidden over cards */ }
}

window.setup = async (words, warpPts) => { setWarp(warpPts || null); WORDS = words.filter(w => !/[\[\]]/.test(w.text)); await document.fonts.load('124px Lilita'); await document.fonts.load('800 34px Inter'); return true; };
window.renderFrame = (t) => { const tt = warp(t); update(tt); sky.position.copy(camera.position); renderer.render(scene, camera); drawOverlay(t); tNow = tt; return document.getElementById('out').toDataURL('image/jpeg', 0.93); };
window.ready = true;
</script>
