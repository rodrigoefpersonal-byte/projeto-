import * as THREE from 'three';

  } else {

function pose(g, { walk = 0, wave = 0, shock = 0, kneel = 0, look = 0, sip = 0 } = {}) {

  if (vignette > 0) { const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.25, W / 2, H / 2, H * 0.75); g.addColorStop(0, 'rgba(120,0,0,0)'); g.addColorStop(1, `rgba(120,0,0,${vignette})`); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
  if (darken > 0) { ctx.fillStyle = `rgba(8,10,20,${darken})`; ctx.fillRect(0, 0, W, H); }
  if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash * 0.85})`; ctx.fillRect(0, 0, W, H); }
  for (const tg of tags) { const p = project(tg.world); if (p.behind) continue; pill(clamp(p.x, 230, W - 230), clamp(p.y, 200, H - 420), tg.text, tg.dot, tg.age); }
  if (hud) {
    const s = easeOut(clamp(hud.age / 0.25));
    if (hud.kind === 'big') { ctx.save(); ctx.translate(W / 2, 250); ctx.scale(s, s); outlined(hud.top, 0, 0, 190, '#ffffff'); ctx.font = '800 40px Inter'; outlined(hud.sub, 0, 118, 46, '#ffffff', '#1b2030', 9); ctx.restore(); }
    if (hud.kind === 'floor') { ctx.save(); ctx.translate(W / 2, 250); ctx.scale(s, s); outlined(`${hud.n}º`, 0, 0, 170, hud.n >= 12 ? '#ffd23f' : '#ffffff'); outlined('ANDAR', 0, 108, 50, '#ffffff', '#1b2030', 9); ctx.restore(); }
    if (hud.kind === 'clock') { ctx.save(); ctx.translate(W / 2, 260); ctx.scale(s, s); rr(-230, -95, 460, 190, 34); ctx.fillStyle = 'rgba(20,24,36,0.88)'; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = '#ffd23f'; ctx.stroke(); ctx.font = '120px Lilita'; ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(hud.text, 0, -18); ctx.font = '800 34px Inter'; ctx.fillStyle = '#ffd23f'; ctx.fillText(hud.sub, 0, 58); ctx.restore(); }
    if (hud.kind === 'arc') {
      const text = hud.text, R = 900, cx = W / 2, cy = 330 + R; ctx.save();
      ctx.font = '96px Lilita'; const ws = [...text].map(c => ctx.measureText(c).width * 1.06); const sum = ws.reduce((a, b) => a + b, 0); const tot = sum / R;
      let ang = -tot / 2; const sc = s;
      for (let i = 0; i < text.length; i++) { const a = ang + (ws[i] / sum) * tot / 2; ctx.save(); ctx.translate(cx + Math.sin(a) * R, cy - Math.cos(a) * R); ctx.rotate(a); ctx.scale(sc, sc); outlined(text[i], 0, 0, 96, '#ffd23f'); ctx.restore(); ang += (ws[i] / sum) * tot; }
      ctx.restore();
    }
    if (hud.kind === 'measure') {
      const a = project(hud.a), b = project(hud.b); ctx.save(); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 7; ctx.shadowColor = 'rgba(0,0,0,0.4)'; ctx.shadowBlur = 6;
      const x = a.x + 70; ctx.beginPath(); ctx.moveTo(x, a.y); ctx.lineTo(x, b.y); ctx.stroke();
      for (const y of [a.y, b.y]) { ctx.beginPath(); ctx.moveTo(x - 22, y); ctx.lineTo(x + 22, y); ctx.stroke(); }
      ctx.restore(); if (Math.abs(b.y - a.y) > 120) pill(x + 10, (a.y + b.y) / 2, hud.label, '#ffd23f', hud.age);
    }
  }
  if (endCard) {
    const a = endCard.t;
    const k1 = easeOut(seg(a, 47.95, 48.25)), k2 = easeOut(seg(a, 49.2, 49.5)), k3 = easeOut(seg(a, 50.6, 50.9)), k4 = seg(a, 52.0, 52.4);
    ctx.save(); ctx.translate(W / 2, 700); ctx.scale(k1, k1); outlined('PARTE 2', 0, 0, 210, '#ffffff'); ctx.restore();
    ctx.save(); ctx.globalAlpha = k2; ctx.translate(W / 2, 900); outlined('4 SUSPEITOS.', 0, 0, 110, '#ffd23f'); ctx.restore();
    ctx.save(); ctx.globalAlpha = k3; ctx.translate(W / 2, 1040); ctx.scale(0.8 + 0.2 * k3, 0.8 + 0.2 * k3); outlined('1 CULPADO.', 0, 0, 120, '#ff4b3e'); ctx.restore();
    ctx.save(); ctx.globalAlpha = k4; ctx.font = '800 40px Inter'; ctx.fillStyle = '#e9edf5'; ctx.textAlign = 'center'; ctx.fillText('SEGUE PRA NÃO PERDER', W / 2, 1220); ctx.restore();
  }
  // captions
  if (!endCard) {
    let cur = null;
    for (const w of WORDS) { if (t >= w.start - 0.03 && t < w.end + 0.45) cur = w; }
    if (cur) {
      const nextIdx = WORDS.indexOf(cur) + 1; if (WORDS[nextIdx] && t >= WORDS[nextIdx].start - 0.03) cur = WORDS[nextIdx];
      const txt = clean(cur.text); const key = txt.toLowerCase();
      const disp = txt.charAt(0).toUpperCase() + txt.slice(1);
      const age = t - cur.start; const sc = age < 0.12 ? lerp(1.28, 1, easeOut(clamp(age / 0.12))) : 1;
      let size = 124; ctx.font = `${size}px Lilita`; while (ctx.measureText(disp).width > W - 220) { size -= 6; ctx.font = `${size}px Lilita`; }
      ctx.save(); ctx.translate(W / 2, 1210); ctx.scale(sc, sc); outlined(disp, 0, 0, size, HL[key] || '#ffffff'); ctx.restore();
    }
  }
}

window.setup = async (words) => {
  WORDS = words.filter(w => !/^\[.*\]$/.test(w.text));
  await document.fonts.load('124px Lilita'); await document.fonts.load('800 34px Inter');
  return true;
};
window.renderFrame = (t) => {
  update(t); sky.position.copy(camera.position); renderer.render(scene, camera); drawOverlay(t);
  return out.toDataURL('image/jpeg', 0.93);
};
window.ready = true;
</script>
