<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Bebas'; src: url('/assets/fonts/BebasNeue.woff2') format('woff2'); }
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="out" width="1080" height="1920"></canvas>
<script>
// "O 402" - Part 2: dark flat 2D suspense. Times are script time (warped to the narration).
const W = 1080, H = 1920;
const cv = document.getElementById('out'), ctx = cv.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const ease = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const easeOut = x => 1 - Math.pow(1 - x, 3);
const lerp = (a, b, x) => a + (b - a) * x;
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const T = { S1: 0.3, S2: 6.3, S3: 15.8, S4: 24.9, S5: 31.7, S6: 38.1, S7: 46.0, S8: 54.9, END: 60.5 };
const ORDER = ['S1', 'S2', 'S3', 'S4', 'S5', 'S6', 'S7', 'S8'];
function sceneAt(t) { let c = 'S1'; for (const s of ORDER) if (t >= T[s]) c = s; return c; }
const RED = '#ff4b3e', YEL = '#ffd23f', COLD = '#7fa7ff';

function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function box(x, y, w, h, c, r = 0) { if (r) { rr(x, y, w, h, r); } else { ctx.beginPath(); ctx.rect(x, y, w, h); } ctx.fillStyle = c; ctx.fill(); }
function glow(x, y, r, color, a) { const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, color); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = g; ctx.fillRect(x - r, y - r, 2 * r, 2 * r); ctx.restore(); }
function circle(x, y, r, c) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = c; ctx.fill(); }
function txt(s, x, y, size, fill, font = 'Bebas', align = 'center', stroke = null, sw = 0) {
  ctx.font = `${size}px ${font}`; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  if (stroke) { ctx.lineWidth = sw || size * 0.12; ctx.strokeStyle = stroke; ctx.strokeText(s, x, y); }
  ctx.fillStyle = fill; ctx.fillText(s, x, y);
}
function pill(x, y, text, dot, age) {
  const s = easeOut(clamp(age / 0.2)); if (s <= 0) return;
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.font = '800 38px Inter'; const tw = ctx.measureText(text).width; const w = tw + 84, h = 64;
  ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 14; rr(-w / 2, -h / 2, w, h, h / 2); ctx.fillStyle = '#e9edf5'; ctx.fill(); ctx.shadowColor = 'transparent';
  circle(-w / 2 + 32, 0, 12, dot); ctx.fillStyle = '#10131c'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(text, -w / 2 + 56, 2); ctx.restore();
}
const tiles = []; for (let k = 0; k < 4; k++) { const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d'); const d = g.createImageData(256, 256);
  for (let i = 0; i < d.data.length; i += 4) { const v = hash(i * 0.37 + k * 999) * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = hash(i + k) * 16; } g.putImageData(d, 0, 0); tiles.push(c); }
function finish(t, vig = 0.75, flick = true) {
  const pat = ctx.createPattern(tiles[Math.floor(t * 14) % 4], 'repeat'); ctx.save(); ctx.translate(hash(Math.floor(t * 14)) * 256, hash(Math.floor(t * 14) + 5) * 256); ctx.fillStyle = pat; ctx.fillRect(-256, -256, W + 512, H + 512); ctx.restore();
  const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.78); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${vig})`); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  if (flick) { const f = hash(Math.floor(t * 9) + 3) > 0.93 ? 0.16 : 0; if (f) { ctx.fillStyle = `rgba(0,0,0,${f})`; ctx.fillRect(0, 0, W, H); } }
}
function dust(n, x0, y0, w, h, a, seed, size = 3) { for (let i = 0; i < n; i++) { ctx.globalAlpha = a * (0.4 + hash(seed + i * 3.1) * 0.6); ctx.fillStyle = '#c9ccd6'; const s = 1 + hash(seed + i * 7.7) * size; ctx.fillRect(x0 + hash(seed + i) * w, y0 + hash(seed + i * 2.3) * h, s, s); } ctx.globalAlpha = 1; }

// ---------- floor plan helpers (same layout for 402 and the apartment below) ----------
const PATH = [[200, 1330], [200, 1000], [520, 1000], [520, 700], [800, 700]];
function pathAt(f) { const segs = []; let tot = 0; for (let i = 0; i < PATH.length - 1; i++) { const d = Math.hypot(PATH[i + 1][0] - PATH[i][0], PATH[i + 1][1] - PATH[i][1]); segs.push(d); tot += d; } let d = f * tot; for (let i = 0; i < segs.length; i++) { if (d <= segs[i]) { const k = d / segs[i]; return [lerp(PATH[i][0], PATH[i + 1][0], k), lerp(PATH[i][1], PATH[i + 1][1], k)]; } d -= segs[i]; } return PATH[PATH.length - 1]; }
function plan(color, dx, dy, alpha, label, lx = 540) {
  ctx.save(); ctx.translate(dx, dy); ctx.globalAlpha = alpha; ctx.strokeStyle = color; ctx.lineWidth = 9; ctx.strokeRect(110, 430, 860, 940);
  ctx.beginPath(); ctx.moveTo(560, 430); ctx.lineTo(560, 600); ctx.moveTo(560, 800); ctx.lineTo(560, 900); ctx.lineTo(970, 900); ctx.moveTo(110, 900); ctx.lineTo(420, 900); ctx.stroke();
  txt(label, lx, 330, 100, color); txt('QUARTO', 770, 520, 48, color); ctx.restore();
}
function blueprintBg() { box(0, 0, W, H, '#06132a'); ctx.strokeStyle = 'rgba(111,163,255,0.1)'; ctx.lineWidth = 2; for (let x = 0; x <= W; x += 60) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); } for (let y = 0; y <= H; y += 60) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); } }
function bedIcon(x, y, a, col) { ctx.save(); ctx.globalAlpha = a; box(x - 110, y - 70, 220, 140, col, 14); box(x - 100, y - 60, 70, 50, 'rgba(255,255,255,0.35)', 10); txt('CAMA', x + 10, y + 12, 52, '#10131c'); ctx.restore(); }

// ---------- S1: the door, the whisper ----------
function sceneS1(u) {
  box(0, 0, W, H, '#020308');
  const x0 = 250, x1 = 830, top = 260, bot = 1660, op = 0.78;
  const g = ctx.createLinearGradient(x0, 0, x1, 0); g.addColorStop(0, '#000'); g.addColorStop(0.5, 'rgba(60,90,160,0.6)'); g.addColorStop(1, '#000'); ctx.fillStyle = g; ctx.fillRect(x0, top, x1 - x0, bot - top);
  box(x0 - 30, top - 30, x1 - x0 + 60, 30, '#1a1418'); box(x0 - 30, top, 30, bot - top, '#1a1418'); box(x1, top, 30, bot - top, '#1a1418');
  const edge = lerp(x1, x0 + 60, op), off = op * 120; ctx.fillStyle = '#2d2024'; ctx.beginPath(); ctx.moveTo(x0, top); ctx.lineTo(edge, top + off); ctx.lineTo(edge, bot - off); ctx.lineTo(x0, bot); ctx.closePath(); ctx.fill();
  for (let r = 0; r < 4; r++) { const rad = ((u * 120 + r * 130) % 520) + 40; ctx.strokeStyle = `rgba(255,75,62,${0.5 * (1 - rad / 600)})`; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(540, 960, rad, -0.6, 0.6); ctx.stroke(); ctx.beginPath(); ctx.arc(540, 960, rad, Math.PI - 0.6, Math.PI + 0.6); ctx.stroke(); }
  const a = easeOut(seg(u, 0.1, 0.7)) * (1 - seg(u, 3.6, 4.6)); ctx.globalAlpha = a; txt('PARTE 2', 540, 150, 200, '#ffffff', 'Bebas', 'center', '#000', 8); ctx.globalAlpha = 1;
  const j = hash(Math.floor(u * 24)) * 5 - 2.5; txt('…', 540 + j, 960, 220, `rgba(255,75,62,${0.45 + 0.4 * Math.sin(u * 9)})`);
}

// ---------- S2: inside the 402, chalk line + 14 marks ----------
function sceneS2(u) {
  const sway = Math.sin(u * 0.9) * 10; box(0, 0, W, H, '#05060c');
  const hz = 740; // horizon
  ctx.save(); ctx.translate(sway, 0);
  box(-30, 0, W + 60, hz, '#0b1020'); box(-30, hz, W + 60, H - hz, '#0f1424');
  ctx.fillStyle = '#080b16'; ctx.beginPath(); ctx.moveTo(-30, 0); ctx.lineTo(300, hz - 40); ctx.lineTo(300, hz + 20); ctx.lineTo(-30, 1300); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(W + 30, 0); ctx.lineTo(780, hz - 40); ctx.lineTo(780, hz + 20); ctx.lineTo(W + 30, 1300); ctx.closePath(); ctx.fill();
  box(300, hz - 160, 480, 180, '#1a2447'); box(330, hz - 130, 420, 150, '#070a14'); // far doorway to the bedroom
  glow(540, hz - 40, 260, '#3c5ea8', 0.45 + 0.1 * Math.sin(u * 2));
  ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth = 3; for (let i = 0; i < 9; i++) { const f = i / 8; ctx.beginPath(); ctx.moveTo(lerp(300, -200, f), hz + 20 + f * 20); ctx.lineTo(lerp(780, 1280, f), hz + 20 + f * 20); ctx.stroke(); }
  // chalk line (perspective) and marks
  const pos = d => ({ y: hz + 20 + 1000 * Math.pow(1 - d, 2.1), s: 0.12 + 0.88 * Math.pow(1 - d, 2.1) });
  ctx.strokeStyle = 'rgba(240,244,255,0.85)'; ctx.lineCap = 'round'; const lineK = easeOut(seg(u, 3.4, 6.6));
  for (let i = 0; i < 60; i++) { const d0 = (i / 60) * lineK * 0.9, d1 = d0 + 0.006; const a = pos(d0), b = pos(d1); ctx.lineWidth = 12 * a.s + 1; ctx.globalAlpha = i % 2 ? 0.4 : 0.9; ctx.beginPath(); ctx.moveTo(540 + sway * 0, a.y); ctx.lineTo(540, b.y); ctx.stroke(); }
  ctx.globalAlpha = 1; ctx.lineCap = 'butt';
  for (let k = 13; k >= 0; k--) { const tk = 5.0 + k * 0.26; if (u < tk) continue; const d = (k + 0.5) / 14 * 0.88, p = pos(d); const pop = easeOut(clamp((u - tk) / 0.15));
    ctx.save(); ctx.translate(540, p.y); ctx.scale(p.s * pop, p.s * pop); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 12; ctx.beginPath(); ctx.moveTo(-34, -34); ctx.lineTo(34, 34); ctx.moveTo(34, -34); ctx.lineTo(-34, 34); ctx.stroke(); ctx.restore(); }
  ctx.restore();
  // flashlight cone from the bottom
  const fl = hash(Math.floor(u * 11)) > 0.96 ? 0.6 : 1; const cone = ctx.createRadialGradient(540, 1900, 40, 540, 1200, 900); cone.addColorStop(0, `rgba(255,240,200,${0.34 * fl})`); cone.addColorStop(1, 'rgba(255,240,200,0)'); ctx.fillStyle = cone; ctx.beginPath(); ctx.moveTo(380, 1920); ctx.lineTo(0, 700); ctx.lineTo(1080, 700); ctx.lineTo(700, 1920); ctx.closePath(); ctx.fill();
  dust(110, 0, 600, W, 1000, 0.5, 5 + Math.floor(u * 2), 3);
  const lit = easeOut(seg(u, 0, 0.6)); ctx.fillStyle = `rgba(0,0,0,${1 - lit})`; ctx.fillRect(0, 0, W, H);
  if (u > 4.4) pill(540, 330, 'UMA LINHA DE GIZ', COLD, u - 4.4);
}

// ---------- S3: the plans overlap ----------
function sceneS3(u) {
  blueprintBg(); const k = easeOut(seg(u, 0.5, 3.4));
  plan('#6fa3ff', 0, 0, 1, '402', 300); const ay = lerp(240, 0, k), ax = lerp(60, 0, k); plan('#ff6a5e', ax, ay, 0.9 * Math.min(1, u / 0.8), '302 (EU)', 790);
  ctx.strokeStyle = '#ffffff'; ctx.setLineDash([16, 14]); ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(PATH[0][0], PATH[0][1]); for (let i = 1; i < PATH.length; i++) ctx.lineTo(PATH[i][0], PATH[i][1]); ctx.stroke(); ctx.setLineDash([]);
  const pulse = 0.5 + 0.5 * Math.sin(u * 7); const rv = seg(u, 4.6, 5.4);
  if (rv > 0) { bedIcon(800, 700, rv, '#ff6a5e'); glow(800, 700, 260, RED, 0.5 * pulse * rv); ctx.strokeStyle = RED; ctx.lineWidth = 8; ctx.globalAlpha = rv; ctx.beginPath(); ctx.arc(800, 700, 120 + 24 * pulse, 0, Math.PI * 2); ctx.stroke(); ctx.globalAlpha = 1; pill(540, 1620, 'A LINHA TERMINA NA CAMA', RED, u - 5.4); }
  if (k > 0.5 && rv === 0) pill(540, 1620, 'MESMA PLANTA, UM ANDAR ACIMA', COLD, u - 2.4);
}

// ---------- S4: the building manager ----------
function sceneS4(u) {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#1d150f'); g.addColorStop(1, '#0a0705'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  glow(760, 380, 700, '#ffcf80', 0.32); box(60, 300, 420, 520, '#2a1d14', 12); ctx.strokeStyle = '#4a3624'; ctx.lineWidth = 6; ctx.strokeRect(60, 300, 420, 520);
  for (let r = 0; r < 3; r++) for (let c = 0; c < 4; c++) { const x = 120 + c * 100, y = 380 + r * 150; const missing = r === 1 && c === 2; circle(x, y, 7, '#6b5238'); if (!missing) { box(x - 3, y, 6, 50, '#c9a84a'); box(x - 22, y + 50, 44, 26, '#e8e0cc', 4); txt(String(300 + r * 4 + c + 1), x, y + 64, 24, '#2a1d14', 'Bebas'); } else { ctx.strokeStyle = 'rgba(255,75,62,0.7)'; ctx.lineWidth = 4; ctx.setLineDash([8, 8]); ctx.strokeRect(x - 26, y + 6, 52, 80); ctx.setLineDash([]); txt('402', x, y + 130, 40, RED); } }
  box(0, 1280, W, 640, '#150f0a'); box(60, 1230, 960, 60, '#3a2a1d', 10);
  const nod = Math.sin(u * 1.4) * 4; ctx.save(); ctx.translate(700, 0);
  ctx.fillStyle = '#16243d'; ctx.beginPath(); ctx.moveTo(-300, 1260); ctx.lineTo(-250, 960); ctx.quadraticCurveTo(0, 880, 250, 960); ctx.lineTo(300, 1260); ctx.closePath(); ctx.fill();
  circle(0, 780 + nod, 150, '#a37a5a'); ctx.fillStyle = '#2a1d14'; ctx.beginPath(); ctx.arc(0, 740 + nod, 152, Math.PI * 1.02, Math.PI * 1.98); ctx.fill();
  box(-100, 760 + nod, 80, 26, 'rgba(10,10,14,0.9)', 12); box(20, 760 + nod, 80, 26, 'rgba(10,10,14,0.9)', 12); ctx.strokeStyle = '#0a0a0e'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(-20, 773 + nod); ctx.lineTo(20, 773 + nod); ctx.stroke();
  ctx.fillStyle = '#2a1d14'; ctx.beginPath(); ctx.moveTo(-60, 860 + nod); ctx.quadraticCurveTo(0, 880 + nod, 60, 860 + nod); ctx.quadraticCurveTo(0, 845 + nod, -60, 860 + nod); ctx.fill();
  ctx.strokeStyle = '#0a0a0e'; ctx.lineWidth = 7; ctx.beginPath(); ctx.moveTo(-40, 905 + nod); ctx.quadraticCurveTo(0, 898 + nod, 40, 905 + nod); ctx.stroke();
  const sw = ((u * 0.5) % 1); ctx.fillStyle = 'rgba(150,200,255,0.8)'; ctx.beginPath(); ctx.ellipse(120, 690 + sw * 150 + nod, 9, 15, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  pill(540, 300 + 0, 'SÍNDICO', YEL, u - 0.2);
  if (u > 2.0) pill(540, 1560, 'QUEM TEM A CHAVE DO 402?', RED, u - 2.0);
  if (u > 4.4) { const d = (Math.floor((u - 4.4) / 0.5) % 4); txt('.'.repeat(d), 880, 520, 120, 'rgba(255,255,255,0.8)'); }
}

// ---------- S5: "the old tenant" -> missing flyer ----------
function sceneS5(u) {
  box(0, 0, W, H, '#07080e'); glow(540, 900, 800, '#2a1a1a', 0.5);
  const q = 1 - seg(u, 2.4, 3.0);
  if (q > 0) { ctx.globalAlpha = q; txt('“SÓ O MORADOR ANTIGO', 540, 760, 120, '#ffffff'); txt('DO SEU APARTAMENTO.', 540, 890, 120, '#ffffff'); txt('AQUELE QUE SUMIU', 540, 1020, 120, RED); txt('FAZ UM ANO.”', 540, 1150, 120, RED); ctx.globalAlpha = 1; }
  const k = easeOut(seg(u, 2.6, 3.3)); if (k > 0) {
    ctx.save(); ctx.translate(540, 800 + (1 - k) * 600); ctx.rotate(-0.05 + (1 - k) * 0.2); ctx.scale(0.6 + 0.4 * k, 0.6 + 0.4 * k);
    ctx.shadowColor = 'rgba(0,0,0,0.7)'; ctx.shadowBlur = 40; box(-380, -560, 760, 1120, '#d9d2bd', 6); ctx.shadowColor = 'transparent';
    for (let i = 0; i < 500; i++) { ctx.globalAlpha = 0.05; ctx.fillStyle = '#6b5a3a'; ctx.fillRect(-380 + hash(i) * 760, -560 + hash(i + 9) * 1120, 3, 3); } ctx.globalAlpha = 1;
    txt('DESAPARECIDO', 0, -440, 150, '#b01c14'); box(-250, -330, 500, 520, '#2a2a2f'); ctx.fillStyle = '#0d0d11'; ctx.beginPath(); ctx.arc(0, -120, 110, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.moveTo(-200, 190); ctx.quadraticCurveTo(0, -20, 200, 190); ctx.closePath(); ctx.fill();
    txt('?', 0, -110, 150, '#5c5c66'); txt('AP. 302', 0, 290, 110, '#1a1410'); txt('HÁ 1 ANO', 0, 390, 90, '#b01c14'); txt('VISTO PELA ÚLTIMA VEZ ÀS 3:07', 0, 480, 44, '#3a3226', 'Bebas');
    circle(0, -560, 18, '#b01c14'); ctx.restore(); }
  if (u > 4.2) pill(540, 250, 'O SEU APARTAMENTO', RED, u - 4.2);
}

// ---------- S6: rehearsing the path ----------
function sceneS6(u) {
  blueprintBg(); plan('#6fa3ff', 0, 0, 0.9, '402'); ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.setLineDash([16, 14]); ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(PATH[0][0], PATH[0][1]); for (let i = 1; i < PATH.length; i++) ctx.lineTo(PATH[i][0], PATH[i][1]); ctx.stroke(); ctx.setLineDash([]);
  for (let pass = 0; pass < 5; pass++) { const f = clamp(((u - pass * 1.3) / 1.2)); if (f <= 0) continue; for (let k = 0; k < 14; k++) { if ((k + 0.5) / 14 > f) continue; const [x, y] = pathAt((k + 0.5) / 14); glow(x, y, 40, '#9cc0ff', 0.12); circle(x, y, 9, `rgba(188,212,255,${0.25 + 0.1 * pass})`); } const [hx, hy] = pathAt(Math.min(f, 1)); if (f < 1) { glow(hx, hy, 70, '#ffffff', 0.5); circle(hx, hy, 15, '#ffffff'); } }
  bedIcon(800, 700, 0.35 + 0.4 * seg(u, 5, 7), '#ff6a5e');
  const night = Math.floor(lerp(1, 90, easeOut(seg(u, 0, 6.5)))); txt(`NOITE ${String(night).padStart(2, '0')}`, 540, 190, 200, night > 80 ? RED : '#ffffff');
  if (u > 1.2) pill(540, 1620, 'ENSAIANDO O CAMINHO', RED, u - 1.2);
}

// ---------- S7: now the steps are in the room ----------
const IN_STEPS = [1.2, 2.1, 3.0, 3.9, 4.8, 5.7, 6.6];
function sceneS7(u) {
  box(0, 0, W, H, '#04060c'); const z = 1 + 0.07 * u / 8.9; ctx.save(); ctx.translate(540, 960); ctx.scale(z, z); ctx.translate(-540, -960);
  box(70, 330, 940, 530, '#0a0f1f'); box(70, 860, 940, 30, '#03050a'); txt('402', 880, 420, 80, 'rgba(127,167,255,0.18)'); txt('VAZIO', 880, 490, 44, 'rgba(255,255,255,0.14)');
  box(70, 894, 940, 530, '#131c38'); box(70, 1424, 940, 20, '#080b16');
  box(600, 960, 170, 230, '#0b122a'); box(610, 970, 150, 210, '#1b2c55'); box(678, 970, 14, 210, '#0b122a');
  box(72, 940, 150, 484, '#05070e'); box(72, 940, 14, 484, '#0b122a'); ctx.fillStyle = 'rgba(127,167,255,0.10)'; ctx.fillRect(86, 950, 6, 470); glow(150, 1200, 260, '#3c5ea8', 0.12);
  box(420, 1320, 80, 104, '#0d142c'); box(436, 1300, 48, 22, '#05070e', 4); circle(460, 1312, 5, Math.floor(u * 2) % 2 ? RED : '#4a1612');
  box(560, 1330, 440, 94, '#1d2748', 12); box(962, 1180, 34, 250, '#0d142c', 8); ctx.fillStyle = '#26335c'; ctx.beginPath(); ctx.ellipse(740, 1318, 220, 62, 0, Math.PI, 0); ctx.fill(); box(520, 1318, 480, 30, '#26335c');
  circle(900, 1285, 46, '#a68a74'); ctx.fillStyle = '#1a1411'; ctx.beginPath(); ctx.arc(900, 1272, 48, Math.PI, Math.PI * 2); ctx.fill(); box(852, 1270, 18, 26, '#1a1411');
  const wide = seg(u, 1.0, 7.0); for (const ex of [885, 913]) { circle(ex, 1290, 8 + 4 * wide, '#e8eefc'); circle(ex + 2, 1291, 3.2, '#10131c'); }
  // steps inside the room, from the doorway toward the bed
  IN_STEPS.forEach((ts, k) => { if (u < ts) return; const a = Math.max(0.3, 1 - (u - ts) * 0.35); const x = 250 + k * 46, y = 1385 + (k % 2 ? 14 : -4);
    glow(x, y, 80, RED, 0.6 * a); ctx.save(); ctx.translate(x, y); ctx.rotate(1.35); ctx.scale(1.7, 1.7); ctx.globalAlpha = a; ctx.fillStyle = '#ffb0a8'; ctx.beginPath(); ctx.ellipse(0, 0, 13, 26, 0, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.ellipse(-2, -32, 9, 7, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore(); });
  ctx.restore();
  const gl = hash(Math.floor(u * 20)) > 0.9 ? (hash(Math.floor(u * 20) + 9) - 0.5) * 16 : 0; txt('03:07', 540 + gl, 190, 250, RED, 'Bebas', 'center', '#2a0705', 14);
  if (u > 5.2) pill(540, 1560, 'NÃO VINHAM DE CIMA', RED, u - 5.2);
}

// ---------- S8: counting ----------
function sceneS8(u) {
  box(0, 0, W, H, '#010206'); const beats = [0.9, 1.9, 2.9], cur = beats.filter(b => u >= b).length;
  if (cur > 0 && u < 4.1) { const age = u - beats[cur - 1], sc = 1 + 0.35 * Math.exp(-age * 7); glow(540, 900, 600, RED, 0.35 * Math.exp(-age * 3)); ctx.save(); ctx.translate(540, 860); ctx.scale(sc, sc); txt(String(cur), 0, 0, 520, '#ffffff', 'Bebas', 'center', RED, 14); ctx.restore(); }
  if (u > 3.2 && u < 4.1) { const j = hash(Math.floor(u * 30)) * 14 - 7; ctx.globalAlpha = 0.6; txt('4', 540 + j, 860, 520, RED); ctx.globalAlpha = 1; }
  if (u > 4.15) { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); }
}

let WORDS = [], WARP = null;
function warp(t) { if (!WARP) return t; const A = WARP; if (t <= A[0][0]) return A[0][1] + (t - A[0][0]); for (let i = 1; i < A.length; i++) if (t <= A[i][0]) { const [n0, o0] = A[i - 1], [n1, o1] = A[i]; return o0 + (o1 - o0) * (t - n0) / (n1 - n0); } const L = A[A.length - 1]; return L[1] + (t - L[0]); }
const HL = { ninguém: RED, giz: YEL, linha: YEL, catorze: RED, marcas: YEL, cama: RED, 'cima': YEL, síndico: YEL, chave: RED, sumiu: RED, morador: YEL, antigo: YEL, ensaiando: RED, dormindo: RED, '3:07': RED, passos: RED, contar: RED, vazio: RED, nome: RED, 'um': '#ffffff' };
const clean = w => w.replace(/[.,:;!?…"“”]+$/g, '').replace(/^["“”]/, '');
function captions(tn, show) {
  if (!show) return; let cur = null; for (const w of WORDS) if (tn >= w.start - 0.03 && tn < w.end + 0.45) cur = w;
  if (!cur) return; const nx = WORDS[WORDS.indexOf(cur) + 1]; if (nx && tn >= nx.start - 0.03) cur = nx;
  const s = clean(cur.text); if (!s) return; const disp = s.toUpperCase(); const age = tn - cur.start; const sc = age < 0.1 ? lerp(1.2, 1, easeOut(clamp(age / 0.1))) : 1;
  let size = 190; ctx.font = `${size}px Bebas`; while (ctx.measureText(disp).width > W - 160) { size -= 8; ctx.font = `${size}px Bebas`; }
  ctx.save(); ctx.translate(W / 2, 1470); ctx.scale(sc, sc); txt(disp, 0, 0, size, HL[s.toLowerCase()] || '#ffffff', 'Bebas', 'center', '#000', size * 0.1); ctx.restore();
}
function frame(tn) {
  const t = warp(tn); const S = sceneAt(t); const u = t - T[S];
  ctx.save(); ctx.clearRect(0, 0, W, H);
  ({ S1: sceneS1, S2: sceneS2, S3: sceneS3, S4: sceneS4, S5: sceneS5, S6: sceneS6, S7: sceneS7, S8: sceneS8 })[S](u, t);
  finish(t, 0.8, S !== 'S8'); ctx.restore();
  captions(tn, S !== 'S8' || u < 4.1);
}
window.setup = async (words, warpPts) => { WARP = warpPts || null; WORDS = words.filter(w => !/[\[\]]/.test(w.text)); await document.fonts.load('150px Bebas'); await document.fonts.load('800 38px Inter'); return true; };
window.renderFrame = tn => { frame(tn); return cv.toDataURL('image/jpeg', 0.93); };
window.ready = true;
</script>
