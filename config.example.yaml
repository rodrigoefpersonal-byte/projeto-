# Quem é o cliente ideal e o que você oferece
offer: >
  Edição de vídeo profissional para Reels/TikTok/YouTube: cortes, legendas,
  thumbnails e roteiro. Entrega em 48h. Primeiro vídeo de teste grátis.
portfolio_url: "https://seu-portfolio.com"
seller_name: "Rodrigo"

search:
  niches:
    pt: ["clínica de estética", "dentista", "academia", "restaurante", "imobiliária", "coach", "loja de roupas", "barbearia"]
  targets:
    - country: BR
      lang: pt
      cc: "55"
      tz: America/Sao_Paulo
      cities: ["São Paulo, SP", "Rio de Janeiro, RJ", "Belo Horizonte, MG", "Curitiba, PR",
               "Porto Alegre, RS", "Brasília, DF", "Salvador, BA", "Fortaleza, CE", "Goiânia, GO"]
  min_rating_count: 10
  max_results_per_query: 40

qualify:
  min_score: 60                 # 0-100; abaixo disso o lead é descartado
  model: claude-haiku-5-5

send:
  channel_order: ["whatsapp", "email", "instagram"]   # tenta nessa ordem; instagram = fila manual
  daily_limit: 40               # comece baixo e suba aos poucos (aquecimento)
  delay_seconds: [45, 120]      # intervalo aleatório entre envios
  hours: [9, 18]                # horário comercial de Brasília (seg-sáb)
  whatsapp_templates:
    pt: {name: primeiro_contato_video_pt, code: pt_BR}   # template aprovado na Meta
  auto_reply: true              # IA responde dúvidas simples; você assume se houver interesse
