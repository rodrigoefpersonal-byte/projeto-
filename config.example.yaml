# Quem é o cliente ideal e o que você oferece
offer: >
  Serviço completo de vídeo: eu escrevo o roteiro e edito o vídeo (cortes, legendas,
  thumbnail e acabamento), pronto para postar. Você só grava e me envia. Primeiro vídeo
  de teste grátis. Valores: não informar preço; dizer que o Victor passa o orçamento.
portfolio_url: "https://www.instagram.com/newai_studio"
seller_name: "Victor"

search:
  niches:
    pt: ["clínica de estética", "dentista", "academia", "restaurante", "imobiliária", "coach", "loja de roupas", "barbearia"]
  targets:
    - country: BR
      lang: pt
      cc: "55"
      tz: America/Sao_Paulo
      cities: ["São Paulo, SP", "Rio de Janeiro, RJ", "Belo Horizonte, MG", "Curitiba, PR",
               "Porto Alegre, RS", "Brasília, DF", "Salvador, BA", "Fortaleza, CE", "Goiânia, GO"]
  min_rating_count: 10
  max_results_per_query: 40

qualify:
  min_score: 60                 # 0-100; abaixo disso o lead é descartado
  model: claude-haiku-5-5

send:
  # MODO GRÁTIS: "whatsapp_manual" e "instagram" geram a página fila.html (você só clica e envia).
  # MODO AUTOMÁTICO (pago, Meta): troque por ["whatsapp", "email", "instagram"]
  channel_order: ["whatsapp_manual", "instagram"]
  daily_limit: 20               # comece baixo e suba aos poucos (aquecimento)
  delay_seconds: [45, 120]      # intervalo aleatório entre envios
  hours: [9, 18]                # horário comercial de Brasília (seg-sáb)
  whatsapp_templates:
    pt: {name: primeiro_contato_video_pt, code: pt_BR}   # template aprovado na Meta
  auto_reply: true              # IA responde SÓ a 1ª resposta do cliente; depois te avisa e você assume
