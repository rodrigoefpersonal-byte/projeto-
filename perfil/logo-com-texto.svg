<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#23164A"/>
      <stop offset="0.55" stop-color="#110C26"/>
      <stop offset="1" stop-color="#07060F"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="0.5" stop-color="#7B5CFF"/>
      <stop offset="1" stop-color="#FF2E93"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7B5CFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7B5CFF" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FF2E93" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#7B5CFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7B5CFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="2"/>
    </pattern>
    <clipPath id="circle"><circle cx="540" cy="540" r="492"/></clipPath>
    <marker id="head" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#FF2E93"/>
    </marker>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <g clip-path="url(#circle)">
    <rect width="1080" height="1080" fill="url(#grid)"/>
  </g>

  <!-- anel tipo "story" -->
  <circle cx="540" cy="540" r="506" fill="none" stroke="url(#brand)" stroke-width="16"/>

  <!-- barras de crescimento (tráfego) -->
  <g fill="url(#bar)">
    <rect x="285" y="620" width="70" height="110" rx="12"/>
    <rect x="390" y="560" width="70" height="170" rx="12"/>
    <rect x="495" y="500" width="70" height="230" rx="12"/>
    <rect x="600" y="420" width="70" height="310" rx="12"/>
    <rect x="705" y="330" width="70" height="400" rx="12"/>
  </g>

  <!-- linha de crescimento com seta -->
  <polyline points="270,640 400,560 500,600 640,430 770,300" fill="none" stroke="url(#brand)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)" opacity="0.7"/>
  <polyline points="270,640 400,560 500,600 640,430 770,300" fill="none" stroke="url(#brand)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/>

  <!-- botão play (edição de vídeo) -->
  <circle cx="525" cy="505" r="220" fill="url(#glow)"/>
  <circle cx="525" cy="505" r="138" fill="url(#brand)"/>
  <circle cx="525" cy="505" r="138" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="4"/>
  <path d="M488 430 Q480 425 480 435 L480 575 Q480 585 488 580 L600 512 Q608 505 600 498 Z" fill="#ffffff"/>

  <!-- timeline de edição -->
  <g transform="translate(0,0)">
    <rect x="270" y="770" width="540" height="56" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
    <rect x="282" y="782" width="120" height="32" rx="8" fill="#00E5FF" fill-opacity="0.85"/>
    <rect x="410" y="782" width="170" height="32" rx="8" fill="#7B5CFF" fill-opacity="0.9"/>
    <rect x="588" y="782" width="90"  height="32" rx="8" fill="#FF2E93" fill-opacity="0.85"/>
    <rect x="686" y="782" width="112" height="32" rx="8" fill="#00E5FF" fill-opacity="0.5"/>
    <!-- playhead -->
    <line x1="630" y1="752" x2="630" y2="842" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <path d="M616 744 H644 L630 762 Z" fill="#ffffff"/>
  </g>

  <!-- mira (segmentação de anúncios) -->
  <g transform="translate(800,250)" stroke="#00E5FF" stroke-width="6" fill="none" opacity="0.9">
    <circle r="34"/>
    <circle r="14"/>
    <line x1="0" y1="-52" x2="0" y2="-38"/>
    <line x1="0" y1="38" x2="0" y2="52"/>
    <line x1="-52" y1="0" x2="-38" y2="0"/>
    <line x1="38" y1="0" x2="52" y2="0"/>
  </g>

  <text x="540" y="912" text-anchor="middle" font-family="Inter" font-weight="800" font-size="46" letter-spacing="6" fill="#ffffff">EDIÇÃO <tspan fill="#FF2E93">•</tspan> TRÁFEGO</text>
  <text x="540" y="962" text-anchor="middle" font-family="Inter" font-weight="500" font-size="28" letter-spacing="10" fill="#ffffff" fill-opacity="0.6">MARKETING DIGITAL</text>
</svg>
